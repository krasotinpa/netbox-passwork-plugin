name: Bug report
description: Something in the plugin does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include real secrets, tokens or passwords — redact them before posting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a Device page
        2. Switch to the Passwork tab
        3. ...
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: netbox-version
    attributes:
      label: NetBox version
      placeholder: "4.5.2"
    validations:
      required: true
  - type: input
    id: passwork-version
    attributes:
      label: Passwork version
      description: Client-Side Encryption must be disabled (see the README requirements).
      placeholder: "7.6"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or API responses
      description: Output of the `netbox_passwork` logger or the JSON error body, with secrets redacted.
      render: text
